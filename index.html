<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nadir — Preset Rack</title>
<link rel="icon" type="image/png" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#ffffff; --ink:#0a0a0a; --line:#e4e4e4; --mute:#8a8a8a; --rec:#ff3b30; --panel:#f7f7f7; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  
  /* FONDO DE LA PÁGINA CON TU FOTO */
  body{ 
    background: linear-gradient(rgba(0,0,0,0.68), rgba(0,0,0,0.68)), url('fondo.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--bg); 
    font-family:'Space Grotesk', sans-serif; 
    -webkit-font-smoothing:antialiased; 
  }

  .mono{font-family:'JetBrains Mono', monospace;}
  
  header{ padding:24px 6vw; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.15); position:sticky; top:0; background:rgba(10,10,10,0.85); backdrop-filter:blur(10px); z-index:50; }
  .logo{ font-weight:700; font-size:19px; letter-spacing:-0.02em; display:flex; align-items:center; gap:10px; color:#fff; font-family:'Space Grotesk', sans-serif; }
  .logo .dot{ width:9px; height:9px; border-radius:50%; background:#fff; }
  
  /* NAV Y ICONOS SOCIALES */
  .nav-links { display: flex; align-items: center; gap: 20px; }
  .social-icon { display: flex; align-items: center; opacity: 0.7; transition: opacity 0.2s, transform 0.2s; }
  .social-icon:hover { opacity: 1; transform: translateY(-2px); }
  .social-icon svg { width: 20px; height: 20px; fill: #fff; }

  .hero{ padding:11vh 6vw 6vh; border-bottom:1px solid rgba(255,255,255,0.15); background:rgba(10,10,10,0.4); backdrop-filter:blur(6px); }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#bbb; display:flex; align-items:center; gap:8px; margin-bottom:20px; }
  .eyebrow .blink{ width:7px; height:7px; border-radius:50%; background:var(--rec); animation:pulse 1.6s infinite; }
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
  
  .hero h1{ font-size:clamp(34px, 5.6vw, 68px); font-weight:700; letter-spacing:-0.03em; line-height:1; max-width:16ch; color:#fff; font-family:'Space Grotesk', sans-serif; text-transform:none; }
  .hero p{ margin-top:22px; max-width:50ch; color:#ccc; font-size:15.5px; line-height:1.6; font-family:'Space Grotesk', sans-serif; }
  
  .combo{ margin:6vh 6vw 0; padding:26px 28px; background:rgba(20,20,20,0.9); border:1px solid rgba(255,255,255,0.15); color:var(--bg); border-radius:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:18px; backdrop-filter:blur(8px); }
  .combo-txt b{ display:block; font-size:18px; margin-bottom:4px; color:#fff; }
  .combo-txt span{ font-family:'JetBrains Mono', monospace; font-size:12.5px; color:#bbbbbb; }
  
  .rack{ padding:8vh 6vw 14vh; }
  .rack-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:14px; color:#fff; }
  .rack-head h2{ font-size:15px; letter-spacing:.04em; font-family:'Space Grotesk', sans-serif; }
  .rack-head span{ font-family:'JetBrains Mono', monospace; font-size:12px; color:#bbb; }
  
  /* FILA DE PRESETS CON TRANSICIÓN MUY SMOOTH */
  .channel{ 
    display:grid; 
    grid-template-columns: 44px 1fr 140px 130px; 
    align-items:center; 
    gap:18px; 
    padding:18px 16px; 
    border-bottom:1px solid rgba(255,255,255,0.1); 
    background: rgba(15, 15, 15, 0.75);
    backdrop-filter: blur(6px);
    margin-bottom: 8px;
    border-radius: 8px;
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
    cursor:pointer; 
  }
  .channel:hover{ 
    background: rgba(255, 255, 255, 0.95);
    color: #0a0a0a;
    transform: translateX(6px) scale(1.005);
    box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    border-color: transparent;
  }
  .channel:hover .ch-num{ color: #0a0a0a; opacity: 0.6; }
  .channel:hover .ch-price{ color: #0a0a0a; }
  .channel:hover .old-price{ color: #666; }
  .channel:hover .buy-btn{ background: #0a
